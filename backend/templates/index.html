<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Beam Analysis</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    
</head>
<head>
    <style>
        @import url('https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css');
    </style>
</head>
<body class="min-h-screen bg-gradient-to-tl from-gray-900 via-gray-800 to-gray-900 text-white">
    <!-- Navigation Bar -->
    <nav class="flex justify-between items-center p-6 bg-gray-800/50 backdrop-blur-lg shadow-lg rounded-b-2xl">
        <div class="text-lg font-bold flex items-center gap-2">
            <span class="text-pink-400 text-2xl">🏗️</span>
            <span class="bg-clip-text text-transparent bg-gradient-to-r from-pink-400 to-pink-600">Slope Deflection Calculator</span>
        </div>
        <a href="/" class="text-white/80 hover:text-pink-400 transition">Home</a>
    </nav>

    <!-- Main Content -->
    <div class="flex-grow flex items-center justify-center py-12 px-6">
        <div class="max-w-4xl w-full bg-white/5 backdrop-blur-lg shadow-2xl rounded-3xl p-10 border border-pink-400/20 hover:border-pink-400/40 transition-all">
            <form id="beam-form">
                <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-pink-400 to-pink-600 mb-8 text-center">Interactive Beam Analysis</h1>
                <div id="dynamic-fields" class="space-y-8">
                    <!-- Supports Section -->
                    <div id="support-section">
                        <h3 class="text-xl font-semibold bg-clip-text text-transparent bg-gradient-to-r from-pink-400 to-pink-600 mb-4">Supports</h3>
                        <label class="block text-white/70 mb-2">Enter the number of supports (minimum 2):</label>
                        <input type="number" id="num-supports" min="2" required class="border border-pink-400/20 rounded-lg w-full p-3 bg-gray-900/50 text-white focus:ring-2 focus:ring-pink-500">
                        <div id="support-fields" class="mt-4"></div>
                    </div>
                    <!-- Spans Section -->
                    <div id="span-section" class="hidden">
                        <h3 class="text-xl font-semibold bg-clip-text text-transparent bg-gradient-to-r from-pink-400 to-pink-600 mb-4">Spans</h3>
                        <label class="block text-white/70 mb-2">Enter the number of spans:</label>
                        <input type="number" id="num-spans" min="1" required class="border border-pink-400/20 rounded-lg w-full p-3 bg-gray-900/50 text-white focus:ring-2 focus:ring-pink-500">
                        <div id="span-fields" class="mt-4"></div>
                    </div>
                </div>
                <button type="button" id="analyze-button" class="mt-6 w-full bg-pink-600 hover:bg-pink-700 text-white py-3 rounded-xl shadow-lg transition">Analyze</button>
            </form>
            <div id="results" class="mt-6 p-4 bg-gray-50 border rounded-lg"></div>
        </div>
    </div>

    <script>
        const supportSection = document.getElementById('support-section');
        const spanSection = document.getElementById('span-section');

        document.getElementById('num-supports').addEventListener('change', () => {
            generateSupportFields();

            // After support fields are configured, show spans section
            if (parseInt(document.getElementById('num-supports').value) >= 2) {
                spanSection.classList.remove('hidden');
            }
        });

        function generateSupportFields() {
            const numSupports = parseInt(document.getElementById('num-supports').value);
            const supportFields = document.getElementById('support-fields');
            supportFields.innerHTML = '';

            for (let i = 1; i <= numSupports; i++) {
                supportFields.innerHTML += `
                    <div class="mt-4">
                        <h4 class="text-gray-700 font-medium">Support ${i}</h4>
                        <label class="block text-gray-600 mt-2">Type of Support:</label>
                        <select class="border rounded w-full p-2 support-type">
                            <option value="hinged">Hinged</option>
                            <option value="fixed">Fixed</option>
                            <option value="roller">Roller</option>
                            <option value="none">None</option>
                        </select>
                        <label class="block text-gray-600 mt-2">Position (in meters):</label>
                        <input type="number" class="border rounded w-full p-2 support-position" step="0.1" min="0" required>
                        <label class="block text-gray-600 mt-2">Settlement (in meters):</label>
                        <input type="number" class="border rounded w-full p-2 support-settlement" step="0.001" value="0">
                    </div>
                `;
            }
        }

        document.getElementById('num-spans').addEventListener('change', generateSpanFields);

        function generateSpanFields() {
            const numSpans = parseInt(document.getElementById('num-spans').value);
            const spanFields = document.getElementById('span-fields');
            spanFields.innerHTML = '';

            for (let i = 1; i <= numSpans; i++) {
                spanFields.innerHTML += `
                    <div class="mt-4">
                        <h4 class="text-gray-700 font-medium">Span ${i}</h4>
                        <label class="block text-gray-600 mt-2">Modulus of Elasticity (E) (in kN/m²):</label>
                        <input type="number" class="border rounded w-full p-2 span-e" step="0.1" required>
                        <label class="block text-gray-600 mt-2">Moment of Inertia (I) (in m⁴):</label>
                        <input type="number" class="border rounded w-full p-2 span-i" step="0.01" required>
                        <label class="block text-gray-600 mt-2">Number of Loads:</label>
                        <input type="number" class="border rounded w-full p-2 span-loads" min="0" required>
                        <div class="load-fields mt-4" data-span="${i}"></div>
                    </div>
                `;
            }

            document.querySelectorAll('.span-loads').forEach(input => {
                input.addEventListener('change', generateLoadFields);
            });
        }

        function generateLoadFields(event) {
            const loadFields = event.target.closest('div').querySelector('.load-fields');
            const numLoads = parseInt(event.target.value);
            const spanIndex = loadFields.dataset.span;
            loadFields.innerHTML = '';

            for (let i = 1; i <= numLoads; i++) {
                loadFields.innerHTML += `
                    <div class="mt-4">
                        <h5 class="text-gray-600 font-medium">Load ${i} for Span ${spanIndex}</h5>
                        <label class="block text-gray-600 mt-2">Load Type:</label>
                        <select class="border rounded w-full p-2 load-type">
                            <option value="1">None</option>
                            <option value="2">Point load at center</option>
                            <option value="3">Point load at distance 'a' and 'b'</option>
                            <option value="4">Two equal point loads</option>
                            <option value="5">Three equal point loads</option>
                            <option value="6">Uniformly distributed load</option>
                            <option value="7">Variable load (highest on right)</option>
                            <option value="8">Variable load (highest on left)</option>
                        </select>
                        <label class="block text-gray-600 mt-2">Load Magnitude (kN):</label>
                        <input type="number" class="border rounded w-full p-2 load-magnitude" step="0.1" required>
                        <div class="extra-fields mt-2"></div>
                    </div>
                `;
            }

            document.querySelectorAll('.load-type').forEach(select => {
                select.addEventListener('change', handleLoadTypeChange);
            });
        }

        function handleLoadTypeChange(event) {
            const loadType = parseInt(event.target.value);
            const extraFields = event.target.closest('.mt-4').querySelector('.extra-fields');
            extraFields.innerHTML = '';

            if (loadType === 3) {
                extraFields.innerHTML = `
                    <label class="block text-gray-600 mt-2">Distance 'a' from left end (in meters):</label>
                    <input type="number" class="border rounded w-full p-2 load-distance-a" step="0.1" required>
                    <label class="block text-gray-600 mt-2">Distance 'b' from right end (in meters):</label>
                    <input type="number" class="border rounded w-full p-2 load-distance-b" step="0.1" required>
                `;
            }
        }


        document.getElementById('analyze-button').addEventListener('click', async () => {
    const analyzeButton = document.getElementById('analyze-button');
    try {
        analyzeButton.innerHTML = "Analyzing...";
        analyzeButton.disabled = true;

        const supports = [];
        const spans = [];

        // Gather supports data
        document.querySelectorAll('#support-fields > div').forEach((supportDiv) => {
            const type = supportDiv.querySelector('.support-type').value;
            const position = parseFloat(supportDiv.querySelector('.support-position').value);
            const settlement = parseFloat(supportDiv.querySelector('.support-settlement').value); // get settlement value.
            supports.push({ type, position, settlement });
            // supports.push({ type, position });
        });

        // Gather spans data with validation
        document.querySelectorAll('#span-fields > div').forEach((spanDiv) => {
            const e = parseFloat(spanDiv.querySelector('.span-e').value);
            const i = parseFloat(spanDiv.querySelector('.span-i').value);
            
            if (e <= 0 || i <= 0) {
                throw new Error("Modulus of Elasticity (E) and Moment of Inertia (I) must be greater than zero.");
            }

            const numLoads = parseInt(spanDiv.querySelector('.span-loads').value);
            const loads = [];
            const EI = e * i;

            spanDiv.querySelectorAll('.load-fields > div').forEach((loadDiv) => {
                const type = parseInt(loadDiv.querySelector('.load-type').value);
                const magnitude = parseFloat(loadDiv.querySelector('.load-magnitude').value);
                const load = { type, magnitude };

                if (type === 3) {
                    load.distanceA = parseFloat(loadDiv.querySelector('.load-distance-a').value);
                    load.distanceB = parseFloat(loadDiv.querySelector('.load-distance-b').value);
                }

                loads.push(load);
            });

            spans.push({ EI, loads });
        });

        const payload = { supports, spans };

        const response = await fetch('/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Server error: ${errorText}`);
        }

        const result = await response.json();
        displayResults(result);

    } catch (error) {
        console.error('Error:', error);
        document.getElementById('results').innerHTML = `
            <div class="text-red-500 font-bold">Error: ${error.message}</div>
        `;
    } finally {
        analyzeButton.innerHTML = "Analyze";
        analyzeButton.disabled = false;
    }
});

function displayResults(result) {
    if (result.status !== "success") {
        document.getElementById('results').innerHTML = `
            <div class="text-red-500 font-bold">Error: ${result.message}</div>
        `;
        return;
    }

    const formattedFEM = result.fixed_end_moments.map((fem, index) => {
        const keys = Object.keys(fem);
        return `<p><strong>Span ${index + 1}</strong>: ${keys[0]} = ${fem[keys[0]]?.toFixed(4) || 0} kNm, 
                ${keys[1]} = ${fem[keys[1]]?.toFixed(4) || 0} kNm</p>`;
    }).join('');

    const formattedShearForces = result.shear_forces.map((sf) => 
        `<p>Position: <strong>${sf[0].toFixed(2)} m</strong>, Shear Force: <strong>${sf[1].toFixed(4)} kN</strong></p>`
    ).join('');

    const formattedBendingMoments = result.bending_moments.map((bm) => 
        `<p>Position: <strong>${bm[0].toFixed(2)} m</strong>, Bending Moment: <strong>${bm[1].toFixed(4)} kNm</strong></p>`
    ).join('');

    const maxBM = result.max_bending_moment 
        ? `<p><strong>Max Bending Moment:</strong> ${result.max_bending_moment.value.toFixed(4)} kNm at ${result.max_bending_moment.position.toFixed(4)} m</p>`
        : "<p>Max Bending Moment: Not Found</p>";

    // Format Slope-Deflection Equations
    const formattedSlopeEquations = result.slope_deflection_equations
        ? result.slope_deflection_equations.map(eq => `<p>${eq}</p>`).join('')
        : "<p>No slope-deflection equations available.</p>";


    document.getElementById('results').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-gray-900">
            <div class="p-5 bg-white rounded-xl shadow-md">
                <h3 class="text-lg font-semibold text-pink-500">Fixed End Moments</h3>
                ${formattedFEM}
            </div>
            <div class="p-5 bg-white rounded-xl shadow-md">
                <h3 class="text-lg font-semibold text-purple-500">Slope-Deflection Equations</h3>
                ${formattedSlopeEquations}
            </div>
            <div class="p-5 bg-white rounded-xl shadow-md">
                <h3 class="text-lg font-semibold text-orange-500">Theta Values</h3>
                ${result.theta_values?.join(', ') || 'None'}
            </div>
            <div class="p-5 bg-white rounded-xl shadow-md">
                <h3 class="text-lg font-semibold text-yellow-500">Final Moments</h3>
                ${formatResults(result.final_moments)}
            </div>
            <div class="p-5 bg-white rounded-xl shadow-md">
                <h3 class="text-lg font-semibold text-blue-500">Reactions</h3>
                ${formatResults(result.reactions)}
            </div>
            <div class="p-5 bg-white rounded-xl shadow-md">
                <h3 class="text-lg font-semibold text-blue-500">Shear Forces</h3>
                ${formattedShearForces}
            </div>
            <div class="p-5 bg-white rounded-xl shadow-md">
                <h3 class="text-lg font-semibold text-green-500">Bending Moments</h3>
                ${formattedBendingMoments}
            </div>
            <div class="p-5 bg-white rounded-xl shadow-md col-span-1 md:col-span-2">
                <h3 class="text-lg font-semibold text-red-500">Max Bending Moment</h3>
                ${maxBM}
            </div>
            <div class="mt-4 graph">
                <h3 class="text-lg font-semibold text-gray-800">Diagrams:</h3>
                <img src="${result.diagram_path}" alt="Diagrams" class="mt-2 border rounded w-full">
            </div>
        </div>
    `;
}


function formatResults(data) {
    if (!data) return "No data available.";
    if (typeof data === 'object') {
        return Object.entries(data).map(([key, value]) => 
            `${key}: ${typeof value === 'number' ? value.toFixed(2) : value}`
        ).join("<br>");
    }
    return data;
}


    </script>
</body>
</html>
