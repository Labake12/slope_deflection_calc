<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beam Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navigation Bar with Links -->
    <nav>
        <h1>Beam Analysis Calculator</h1>
        <ul class="nav-links">
            <li><a href="/home">Home</a></li>
            <li><a href="/">Calculator</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- Form Section -->
        <form action="/" method="POST">
            <h2>Enter Beam Details</h2>

            <label for="total_spans">Total Number of Spans:</label>
            <input type="number" id="total_spans" name="total_spans" min="1" required><br><br>

            <div id="span_details_container"></div>

            <button type="submit">Calculate</button>
        </form>

        <!-- Results Section -->
        {% if results %}
        <div class="results-container">
            <h2>Results</h2>
            <table>
                <thead>
                    <tr>
                        <th>Equation</th>
                        <th>Expression</th>
                    </tr>
                </thead>
                <tbody>
                    {% for eq, value in results.items() %}
                    <tr>
                        <td>{{ eq }}</td>
                        <td>{{ value }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% endif %}
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
